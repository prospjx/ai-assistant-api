apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-assistant-api.fullname" . }}
  labels:
    {{- include "ai-assistant-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "ai-assistant-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-assistant-api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-assistant-api.secretName" . }}
                  key: GEMINI_API_KEY
            - name: GEMINI_MODEL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-assistant-api.secretName" . }}
                  key: GEMINI_MODEL
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: HOST
              value: {{ .Values.env.host | default "0.0.0.0" | quote }}
