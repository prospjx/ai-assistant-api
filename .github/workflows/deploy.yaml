name: AI Assistant CD

on:
  workflow_run:
    workflows: ["AI Assistant CI"]
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Verify cluster authentication
        run: |
          aws sts get-caller-identity
          kubectl auth can-i get deployments --namespace default

      - name: Deploy to Kubernetes
        run: |
          kubectl create secret generic ai-assistant-api-secret \
            --from-literal=GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}' \
            --from-literal=GEMINI_MODEL='${{ secrets.GEMINI_MODEL }}' \
            --from-literal=PORT='${{ secrets.PORT }}' \
            --from-literal=HOST='${{ secrets.HOST }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout restart deployment/ai-assistant-api-deployment

      - name: Check rollout status
        run: |
          kubectl rollout status deployment/ai-assistant-api-deployment --timeout=180s
