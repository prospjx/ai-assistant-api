name: AI Assistant CD

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kubectl
        uses: azure/setup-kubectl@v2.0
        id: install

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Check Kubernetes authentication
        id: cluster_auth
        run: |
          if kubectl auth can-i get deployments >/dev/null 2>&1; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping deployment because Kubernetes authentication failed for the configured AWS credentials."
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Kubernetes
        if: steps.cluster_auth.outputs.can_deploy == 'true'
        run: |
          kubectl create secret generic ai-assistant-api-secret \
            --from-literal=GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}' \
            --from-literal=GEMINI_MODEL='${{ secrets.GEMINI_MODEL }}' \
            --from-literal=PORT='${{ secrets.PORT }}' \
            --from-literal=HOST='${{ secrets.HOST }}' \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl apply --validate=false -f k8s/deployment.yaml
          kubectl apply --validate=false -f k8s/service.yaml
      - name: Check rollout status
        if: steps.cluster_auth.outputs.can_deploy == 'true'
        run: kubectl rollout status deployment/ai-assistant-api-deployment
