name: AI Assistant CD

on:
  workflow_run:
    workflows: ["AI Assistant CI"]
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Enable VPC CNI Prefix Delegation (Increases Pod Limit)
        run: |
          kubectl set env daemonset aws-node -n kube-system ENABLE_PREFIX_DELEGATION=true
          kubectl set env daemonset aws-node -n kube-system WARM_PREFIX_TARGET=1

      - name: Deploy to Kubernetes
        run: |
          kubectl create secret generic ai-assistant-api-secret \
            --from-literal=GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}' \
            --from-literal=GEMINI_MODEL='${{ secrets.GEMINI_MODEL }}' \
            --from-literal=PORT='${{ secrets.PORT }}' \
            --from-literal=HOST='${{ secrets.HOST }}' \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl apply --validate=false -f k8s/deployment.yaml
          kubectl apply --validate=false -f k8s/service.yaml
          kubectl rollout restart deployment/ai-assistant-api-deployment

      - name: Check rollout status
        run: |
          if ! kubectl rollout status deployment/ai-assistant-api-deployment --timeout=120s; then
            echo "::error::Rollout timed out or failed. Fetching pod diagnostics..."
            echo "=== POD STATUS ==="
            kubectl get pods -l app=ai-assistant-api -o wide
            echo "=== POD EVENTS & DESCRIPTION ==="
            kubectl describe pods -l app=ai-assistant-api
            echo "=== POD LOGS ==="
            kubectl logs -l app=ai-assistant-api --tail=100 --all-containers=true
            exit 1
          fi
